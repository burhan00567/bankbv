<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statement Verification </title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --ink: #344253;
    --muted: #6b7280;
    --line: #e7e7e7;
    --page: #f5f5f5;
    --red: #bd2935;

    /* ===== সাইজ কন্ট্রোল: এখানে সংখ্যা বদলালেই সব বদলে যাবে ===== */
    --logo-height: 33px;                      /* লোগোর উচ্চতা (কম্পিউটার) */
    --logo-height-mobile: 33px;               /* লোগোর উচ্চতা (মোবাইল) */
    --timer-size: clamp(12px, 3vw, 26px);     /* টাইমারের লেখা */
    --title-size: clclamp6px, 4.2vw, 40px);   /* "Statement Verification" */
    --label-size: clamp(16px, 2.4vw, 24px);   /* ধূসর লেবেল */
    --value-size: clamp(18px, 2.7vw, 28px);   /* কালো বোল্ড মান */
    --logo-bg: #ffffff;                       /* লোগোর ব্যাকগ্রাউন্ড রং */
    --card-width: 990px;                      /* কার্ডের সর্বোচ্চ প্রস্থ */
  }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
    line-height: 1.4;
  }
  .topbar {
    background: var(--logo-bg);
    border-bottom: 5px solid #e4e8ed;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px 18px;
    padding: 28px 4.5%;
  }
  .brand { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .brand img { height: var(--logo-height); width: auto; max-width: 60vw; display: block; background: var(--logo-bg); }
  .brand small {
    color: #6c7784;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
  }
  .timer {
    border: 2px solid #f1cfd2;
    background: #fff7f7;
    border-radius: 50px;
    padding: 14px 24px;
    color: var(--red);
    font-size: var(--timer-size);
    font-weight: 700;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    position: relative;
  left: +50px;   /* ডানে সরাতে + সংখ্যা, বামে সরাতে - সংখ্যা */
  top: 0px;    /* নিচে নামাতে + সংখ্যা, ওপরে তুলতে - সংখ্যা */

  }
  .icons { display: flex; align-items: center; gap: 24px; color: #718091; }
  .icon { width: 34px; height: 34px; display: block; }
  .demo {
    max-width: var(--card-width);
    margin: 20px auto 0;
    padding: 10px 16px;
    text-align: center;
    color: #8b252d;
    background: #fff0f0;
    border: 1px solid #e9bfc3;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .5px;
  }
  .card {
    max-width: var(--card-width);
    margin: 24px auto 70px;
    background: #fff;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 2px 5px rgba(0,0,0,.04);
    border: 1px solid #f0f0f0;
  }
  h1 {
    font-size: var(--title-size);
    line-height: 1.2;
    margin: 0;
    padding: 38px 42px 24px;
    border-bottom: 2px solid var(--line);
    letter-spacing: -.5px;
  }
  .content { padding: 40px 42px 48px; }
  .field { margin-bottom: 30px; }
  .field:last-child { margin-bottom: 0; }
  .label { color: var(--muted); font-size: var(--label-size); margin-bottom: 10px; }
  .value { font-size: var(--value-size); font-weight: 700; overflow-wrap: anywhere; }
  hr { border: 0; border-top: 2px solid var(--line); margin: 40px 0; }
  .watermark {
    position: fixed;
    z-index: 5;
    left: 50%;
    top: 52%;
    transform: translate(-50%, -50%) rotate(-28deg);
    font-size: clamp(30px, 8vw, 76px);
    font-weight: 800;
    color: rgba(180, 35, 45, .09);
    letter-spacing: 4px;
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
  }
  @media (max-width: 650px) {
    .topbar { padding: 18px 4%; gap: 12px; }
    .brand img { height: var(--logo-height-mobile); }
    .timer { padding: 10px 16px; }
    .icons { gap: 14px; margin-left: auto; }
    .icon { width: 28px; height: 28px; }
    .demo { margin: 16px 4% 0; }
    .card { margin: 20px 4% 40px; border-radius: 18px; }
    h1 { padding: 26px 22px 20px; }
    .content { padding: 28px 22px 34px; }
    .field { margin-bottom: 24px; }
    hr { margin: 30px 0; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <!-- নিজের লোগো বসাতে নিচের src="..." বদলান (যেমন src="logo.png") -->
    <img id="logo" alt="Logo" src="https://user54584.na.imgto.link/public/20261111/efce5242a88af4ee3aebd610-1000030877.avif">
    
  </div>
  <div class="timer" id="timer">⌛ 179d 23:09:59</div>
  <div class="icons" aria-hidden="true">
    <svg class="icon" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.7"><circle cx="16" cy="16" r="11.5"/><path d="M24.5 24.5 36 36" stroke-linecap="round"/></svg>
    <svg class="icon" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 30h26l-3-4V17c0-7-4-11-10-11S10 10 10 17v9z"/><path d="M16 34c1 3 7 3 8 0"/></svg>
  </div>
</header>


<main class="card">
  <h1>Statement Verification</h1>
  <section class="content">
    <div class="field">
      <div class="label">Account Number</div>
      <div class="value">2304720556541</div>
    </div>
    <div class="field">
      <div class="label">Account Name</div>
      <div class="value">Nilanjana Sajkunjo</div>
    </div>
    <div class="field">
      <div class="label">Statement Period</div>
      <div class="value">03 Aug 2026 to 11 Nov 2026</div>
    </div>
    <hr>
    <div class="field">
      <div class="label">Opening Balance</div>
      <div class="value">1,005.00</div>
    </div>
    <div class="field">
      <div class="label">Closing Balance</div>
      <div class="value">2,387.65</div>
    </div>
    <div class="field">
      <div class="label">Statement Generation Date</div>
      <div class="value">11 Nov 2026</div>
    </div>
  </section>
</main>

<script>
  // কতক্ষণ থেকে কাউন্টডাউন শুরু হবে: দিন, ঘণ্টা, মিনিট, সেকেন্ড
  var START = { d: 179, h: 23, m: 9, s: 59 };

  var total = START.d*86400 + START.h*3600 + START.m*60 + START.s;
  var end = Date.now() + total*1000;
  var el = document.getElementById('timer');
  function pad(n){ return String(n).padStart(2,'0'); }
  function tick(){
    var left = Math.max(0, Math.round((end - Date.now())/1000));
    var d = Math.floor(left/86400), h = Math.floor(left%86400/3600),
        m = Math.floor(left%3600/60), sec = left%60;
    el.textContent = '⌛ ' + d + 'd ' + pad(h) + ':' + pad(m) + ':' + pad(sec);
    if (left === 0) clearInterval(iv);
  }
  var iv = setInterval(tick, 1000);
  tick();
</script>
</body>
</html>
